[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-jailbreak-signature-scanner"
version = "0.1.0"
description = "Multi-heuristic pattern scanner detecting adversarial jailbreak prompts, persona hijacking, and instruction overrides"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-jailbreak-signature-scanner = "agent_jailbreak_signature_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_jailbreak_signature_scanner*"]
